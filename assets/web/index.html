<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SyncCam camera</title>
<style>
  :root { color-scheme: dark; --red: #ff3d5a; --coral: #ff7a59; --green: #3ddc97; --amber: #ffb547; --dim: #a7abba; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .grid { position: fixed; inset: 0; pointer-events: none; display: none;
    background-image: linear-gradient(to right, transparent 33.2%, #fff6 33.3%, transparent 33.4%, transparent 66.5%, #fff6 66.6%, transparent 66.7%),
      linear-gradient(to bottom, transparent 33.2%, #fff6 33.3%, transparent 33.4%, transparent 66.5%, #fff6 66.6%, transparent 66.7%); }
  .bar { position: fixed; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 10px 12px; }
  .top { top: env(safe-area-inset-top); }
  .bottom { bottom: env(safe-area-inset-bottom); }
  .chip { background: #000a; border-radius: 20px; padding: 6px 12px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .spacer { flex: 1; }
  button { font: 600 15px -apple-system, system-ui, sans-serif; border: 0; border-radius: 22px; padding: 10px 16px; background: #2c2c2eee; color: #fff; }
  .rec { position: fixed; top: calc(env(safe-area-inset-top) + 56px); left: 50%; transform: translateX(-50%); display: none;
    background: #c0392bdd; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .big { position: fixed; inset: 0; display: none; place-items: center; font-size: 120px; font-weight: 800; text-shadow: 0 0 30px #000; pointer-events: none; }
  .overlay { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
  .overlay.show, .big.show { display: grid; }
  #start { display: grid; background: radial-gradient(circle at 15% 0%, #ff3d5a2e, transparent 45%),
    radial-gradient(circle at 100% 100%, #7c5cff24, transparent 50%), linear-gradient(#161822, #0d0e13); }
  #start .card { max-width: 420px; width: 100%; }
  #start .logo { width: 128px; height: 128px; display: block; margin: 0 auto 8px; }
  #start h1 { margin: 0 0 4px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  #start .session { color: var(--dim); }
  #start input { width: 100%; padding: 15px 16px; border-radius: 16px; border: 1px solid #ffffff1f; background: #1a1c26; color: #fff; font-size: 17px; margin: 18px 0 14px; }
  #start button.primary { width: 100%; background: linear-gradient(135deg, var(--coral), var(--red)); padding: 16px; font-size: 17px;
    font-weight: 700; border-radius: 18px; box-shadow: 0 8px 24px #ff3d5a55; }
  #identify { background: #fff; color: #000; font-size: 48px; font-weight: 800; }
  #dim { background: #000; color: #555; }
  #ended { background: #111e; }
  .err { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 64px); color: var(--amber); font-size: 12px; text-shadow: 0 0 4px #000; }
  .hint { color: #999; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <div class="grid" id="grid"></div>

  <div class="bar top">
    <span class="chip" id="link"><span class="dot" id="linkDot"></span><span id="linkText">Connecting…</span></span>
    <span class="spacer"></span>
    <span class="chip" id="sync"><span class="dot" id="syncDot"></span><span id="syncText">Syncing clock…</span></span>
  </div>
  <div class="rec" id="rec">● REC 00:00</div>
  <div class="err" id="err"></div>
  <div class="bar bottom">
    <button id="leave">Leave</button>
    <button id="dimBtn">Dim</button>
    <span class="spacer"></span>
    <span class="chip" id="captures">0 captured</span>
  </div>

  <div class="big" id="count"></div>
  <div class="overlay" id="identify"></div>
  <div class="overlay" id="dim"><div>Standby · tap to wake<br><span id="dimRec"></span></div></div>
  <div class="overlay" id="ended"><div><h2 id="endedTitle">Session ended</h2><p id="endedText"></p><button onclick="location.reload()">Rejoin</button></div></div>

  <div class="overlay" id="start">
    <div class="card">
      <img class="logo" src="logo.png" alt="">
      <h1>Join as a camera</h1>
      <div class="session">Shoot: <b id="sessionLabel">{{SESSION}}</b></div>
      <input id="name" placeholder="Name for this camera" autocomplete="off">
      <button class="primary" id="startBtn">Start camera</button>
      <div class="hint">Keep this page open with the screen on while you shoot. Your photos and videos go to the phone running the shoot, and you can save copies here too.</div>
      <div class="err" id="startErr" style="position:static;margin-top:12px"></div>
    </div>
  </div>

<script>window.SYNCCAM = { version: '{{VERSION}}', protocol: {{PROTOCOL}}, session: '{{SESSION}}', mode: '{{MODE}}' };</script>
<script src="transport.js"></script>
<script src="app.js"></script>
</body>
</html>
