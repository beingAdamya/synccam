# Builds both platforms on every push. The iOS job runs on a macOS runner, so
# the iOS app compiles even if you only have a Windows PC. It produces an
# *unsigned* build (proves the Swift + plugins compile); to install on an
# iPhone, sign it with codemagic.yaml or on a Mac (see README).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: synccam-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr synccam-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: synccam-ios-unsigned
          path: synccam-unsigned.ipa

  # Pushing a tag like v0.2.0 publishes a GitHub Release with both builds:
  #   git tag v0.2.0 && git push origin v0.2.0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv dist/synccam-android-apk/app-release.apk "SyncCam-$TAG-android.apk"
          mv dist/synccam-ios-unsigned/synccam-unsigned.ipa "SyncCam-$TAG-ios-unsigned.ipa"
          cat > notes.md <<NOTES
          **Android:** download \`SyncCam-$TAG-android.apk\` on each phone and open it (allow "install unknown apps" when asked).

          **iPhone:** \`SyncCam-$TAG-ios-unsigned.ipa\` is not signed, so iOS won't install it as is. Either sign it on your computer with your Apple ID using Sideloadly or AltStore (free account: the app expires after 7 days), or use \`codemagic.yaml\` to get a signed TestFlight build.

          Not yet tested on physical devices.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "SyncCam $TAG" \
            --notes-file notes.md --prerelease \
            "SyncCam-$TAG-android.apk" "SyncCam-$TAG-ios-unsigned.ipa"
