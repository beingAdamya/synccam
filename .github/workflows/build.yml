# Builds both platforms on every push. The iOS job runs on a macOS runner, so
# the iOS app compiles even if you only have a Windows PC. It produces an
# *unsigned* build (proves the Swift + plugins compile); to install on an
# iPhone, sign it with codemagic.yaml or on a Mac (see README).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # Pull requests from forks get no secrets; they build with the debug key.
            echo "::warning::No signing secrets available, building with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - run: flutter build apk --release
      - name: Check the APK is signed with the SyncCam release key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # Public fingerprint of the release certificate (not a secret).
          EXPECTED: d07074bf5944424bd95add9dfc9c30f6c07059095ede4caa4361040ca573ebc7
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          APK=build/app/outputs/flutter-apk/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "APK certificate: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the release key; refusing to publish it"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: synccam-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr synccam-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: synccam-ios-unsigned
          path: synccam-unsigned.ipa

  # Pushing a tag like v0.2.0 publishes a GitHub Release with both builds:
  #   git tag v0.2.0 && git push origin v0.2.0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv dist/synccam-android-apk/app-release.apk "SyncCam-$TAG-android.apk"
          mv dist/synccam-ios-unsigned/synccam-unsigned.ipa "SyncCam-$TAG-ios-unsigned.ipa"
          cat > notes.md <<NOTES
          **Android:** download \`SyncCam-$TAG-android.apk\` on each phone and open it (allow "install unknown apps" when asked).

          **iPhone:** \`SyncCam-$TAG-ios-unsigned.ipa\` is not signed, so iOS won't install it as is. Either sign it on your computer with your Apple ID using Sideloadly or AltStore (free account: the app expires after 7 days), or use \`codemagic.yaml\` to get a signed TestFlight build.

          **iPhone without installing anything:** on the host phone open Add cameras → "iPhone, no app" and scan the QR code with the iPhone Camera app. No certificate needed; internet only while joining. (No internet? Use the "Offline" tab, which needs a one-time certificate install.)

          Not yet tested on physical devices.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "SyncCam $TAG" \
            --notes-file notes.md --prerelease \
            "SyncCam-$TAG-android.apk" "SyncCam-$TAG-ios-unsigned.ipa"

  # The browser camera page for iPhones (no app, no certificate) is served
  # from GitHub Pages, built from the same assets/web files the host serves.
  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build camera page
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          PROTOCOL=$(grep -oP 'protocolVersion = \K[0-9]+' lib/core/protocol.dart)
          mkdir -p site/cam
          sed -e "s/{{MODE}}/rtc/; s/{{VERSION}}/$VERSION/; s/{{PROTOCOL}}/$PROTOCOL/; s/{{SESSION}}//g" \
            assets/web/index.html > site/cam/index.html
          cp assets/web/app.js assets/web/transport.js site/cam/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=https://github.com/%s">SyncCam' \
            "$GITHUB_REPOSITORY" > site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
